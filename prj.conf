# Configuración BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PostureCorrector"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_MAX_CONN=1

# GPIO y Entradas
CONFIG_GPIO=y
CONFIG_INPUT=y

# Display
CONFIG_DISPLAY=y
CONFIG_MICROBIT_DISPLAY=y

# Sensores
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_LIS2DH=y

# PWM para buzzer
CONFIG_PWM=y
CONFIG_PWM_NRFX=y

# Logging y consola
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Soporte para matemáticas
CONFIG_CBPRINTF_FP_SUPPORT=y

# Heap para BLE
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Aumentar stack del thread principal
CONFIG_MAIN_STACK_SIZE=2048
